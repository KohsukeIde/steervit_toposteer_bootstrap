seed: 42
device: "cuda"
batch_size: 6
num_workers: 4
epochs: 3
max_steps: 50000
lr: 1.5e-4
weight_decay: 1.0e-4
grad_clip_norm: 1.0
log_every: 20
eval_every: 250
save_every: 1000
amp: true

freeze:
  vision_backbone: true
  text_model: true
  connector: false
  segmentation_head: false
  gated_cross_attn: false

loss:
  use_refseg: true
  use_counterfactual: true
  use_background: true
  refseg_weight: 1.0
  cf_weight: 1.0
  bg_weight: 0.25
  cf_margin: 0.10
  background_mode: "union_complement"

data:
  family_whitelist: ["attr", "part", "plain"]
