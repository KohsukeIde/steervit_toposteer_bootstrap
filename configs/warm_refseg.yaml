seed: 42
device: "cuda"
batch_size: 8
num_workers: 4
epochs: 2
max_steps: 20000
lr: 2.0e-4
weight_decay: 1.0e-4
grad_clip_norm: 1.0
log_every: 20
eval_every: 250
save_every: 1000
amp: true

freeze:
  vision_backbone: true
  text_model: true
  connector: false
  segmentation_head: false
  gated_cross_attn: false

loss:
  use_refseg: true
  use_counterfactual: false
  use_background: false
  refseg_weight: 1.0
  cf_weight: 0.0
  bg_weight: 0.0
  cf_margin: 0.10

data:
  family_whitelist: ["plain", "attr", "part"]
