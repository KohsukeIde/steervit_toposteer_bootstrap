[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toposteer"
version = "0.1.0"
description = "Small-scale experiment scaffold for prompt-conditioned topology diagnostics on top of SteerViT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "numpy>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
